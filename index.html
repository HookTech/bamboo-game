<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节节高 · 解压小游戏</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="overlay">
    <h1>节节高</h1>
    <p class="sub">— 解压竹子 · 云端拾金 —</p>
    <p>有节奏地按 <kbd>空格</kbd> ,竹子就会往上长</p>
    <p>小人抱着竹梢,路过金币就顺手收下</p>
    <p class="tip">节奏稳 → 连击加成 · 按太急 → 竹子会晕</p>
    <p class="go">按 空格 开始</p>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
